# GMapping reference configuration — read by both the ROS node
# (dataset_gmapping.launch.py) and the offline gmapping_clf_runner.
#
# Filter-level parameters mirror configs/fastslam/default.yaml where a
# counterpart exists; the scan matcher / likelihood internals are GMapping's
# own defaults (hill climbing: lstep/astep halved over `iterations`
# refinements; lsigma likelihood sigma; ogain weight temperature).
slam_gmapping:
  ros__parameters:
    particles: 40             # num_particles
    delta: 0.025                # map_res
    linearUpdate: 0.05        # linear_update
    angularUpdate: 0.05        # angular_update
    resampleThreshold: 0.5    # N_eff fraction
    # Odometry noise: srr/srt/str/stt are stddev-style coefficients
    # (Thrun's a1-a4 are variance-style), so this is the closest sensible
    # mapping of a1-a4, not an identity.
    srr: 0.1
    srt: 0.2
    str: 0.1
    stt: 0.2

    # maxRange/maxUrange <= 0 -> derived from the scan's range_max
    # (20 m for FLASER logs), same data window fastslam sees.
    maxRange: 0.0
    maxUrange: 0.0

    temporalUpdate: -1.0      # disabled (ROS 1 default)
    map_update_interval: 0.5  # ROS node only
    minimumScore: 0.0
    occ_thresh: 0.25

    # Initial map extent (grows as needed)
    xmin: -20.0
    ymin: -20.0
    xmax: 20.0
    ymax: 20.0

    # Scan matcher internals (GMapping defaults)
    sigma: 0.05
    kernelSize: 1
    lstep: 0.05
    astep: 0.05
    iterations: 5
    lsigma: 0.075
    ogain: 3.0
    lskip: 0
    llsamplerange: 0.01
    llsamplestep: 0.01
    lasamplerange: 0.005
    lasamplestep: 0.005
