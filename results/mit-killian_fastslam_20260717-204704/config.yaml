# Best known mit-killian setup (2026-07-17).
# Peak mode + correlative matcher with 5d284d2-era search params. A ROS-replay
# run of this config scored 0.035 m / 0.56 deg over 4018 relations (full
# dataset, max 0.70 m) — better than gmapping's 0.194 m. Peak mode's noisy
# motion + aggressive resampling looks alarming live (particle spread grows,
# proposal_cov prints zeros — those diagnostics only exist in proposal mode)
# but the surviving lineage maps cleanly. Caveats: that run was unseeded ROS
# replay (drops, no launch-time snapshot) — offline multi-seed certification
# pending; the same config in proposal mode scores 3.7 m (mode is the driver).
# Artifacts: results/mit-killian_ros_peak_20260717/.
fastslam2_node:
  ros__parameters:
    num_particles: 60
    map_chunk_size: 24.0
    map_res: 0.1
    mode: "peak"
    matcher: "grid"
    neff_gain: 3.0
    ray_skip: 1
    a1: 0.075
    a2: 0.1
    a3: 0.075
    a4: 0.1
    scan_match_x_range: 0.05
    scan_match_y_range: 0.05
    scan_match_theta_range: 0.2
    scan_match_step_xy: 0.01
    scan_match_step_theta: 0.01
    z_hit: 0.90
    std_hit: 0.04
    z_rand: 0.1
    linear_update: 0.04
    angular_update: 0.01
    resample_threshold: 0.5
    traj_output_dir: "tmp"
    use_sim_time: true
