fastslam2_node:
  ros__parameters:
    num_particles: 60
    map_chunk_size: 24.0
    map_res: 0.1
    mode: "peak"
    matcher: "grid"
    neff_gain: 3.0
    ray_skip: 1
    a1: 0.075
    a2: 0.1
    a3: 0.075
    a4: 0.1
    scan_match_x_range: 0.05
    scan_match_y_range: 0.05
    scan_match_theta_range: 0.2
    scan_match_step_xy: 0.01
    scan_match_step_theta: 0.01
    z_hit: 0.90
    std_hit: 0.04
    z_rand: 0.1
    linear_update: 0.04
    angular_update: 0.01
    resample_threshold: 0.5
    traj_output_dir: "tmp"
    use_sim_time: true
