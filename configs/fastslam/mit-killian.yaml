# Best mit-killian setup (2026-07-17), offline-certified.
# Peak mode + single-stage grid matcher. Seeded offline run (seed 42, full
# dataset, 68 min): 0.057 ± 0.164 m / 0.41 deg over 4641/4677 relations,
# max 1.67 m — vs gmapping's 0.194 m. Earlier live ROS replay of the same
# setup: 0.035 m over 4018 relations (results/mit-killian_ros_peak_20260717/).
# Notes: peak mode's live diagnostics look alarming (constant resampling,
# proposal_cov prints zeros — those are proposal-mode-only) but are normal;
# the same config in proposal mode scores 3.7 m (mode is the driver). Peak
# mode is input-deterministic but not bit-reproducible (threaded motion
# sampling). Offline artifacts: results/mit-killian_fastslam_20260717-204704/.
fastslam2_node:
  ros__parameters:
    num_particles: 60
    map_chunk_size: 24.0
    map_res: 0.1
    mode: "peak"
    matcher: "grid"
    neff_gain: 3.0
    ray_skip: 1
    a1: 0.075
    a2: 0.1
    a3: 0.075
    a4: 0.1
    scan_match_x_range: 0.05
    scan_match_y_range: 0.05
    scan_match_theta_range: 0.2
    scan_match_step_xy: 0.01
    scan_match_step_theta: 0.01
    z_hit: 0.90
    std_hit: 0.04
    z_rand: 0.1
    linear_update: 0.04
    angular_update: 0.01
    resample_threshold: 0.5
    traj_output_dir: "tmp"
    use_sim_time: true
